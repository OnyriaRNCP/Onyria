name: Tests Hebdomadaires Complets

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      full_coverage:
        description: "Générer rapport de couverture complet"
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: "3.11"
  GROQ_API_KEY: "test-secret-key-for-ci"
  MISTRAL_API_KEY: "test-secret-key-for-ci"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/onyria_test"

jobs:
  weekly-tests:
    name: "Tests Hebdomadaires Complets"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onyria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d onyria_test"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage coverage-badge bandit safety tblib

      - name: Wait for Postgres
        run: |
          echo "Attente de Postgres..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres est prêt !"
              break
            fi
            echo "Tentative $i/30..."
            sleep 2
          done

      - name: Security Audit - Bandit
        continue-on-error: true
        run: |
          echo "Audit sécurité avec Bandit..."
          bandit -r DreamProject/accounts/ DreamProject/diary/ -f json -o bandit-report.json || true
          bandit -r DreamProject/accounts/ DreamProject/diary/ -f txt

      - name: Security Audit - Safety
        continue-on-error: true
        run: |
          echo "Vérification des dépendances avec Safety..."
          safety check --json --output safety-report.json || true
          safety check

      - name: Run All Tests with Coverage
        working-directory: DreamProject
        run: |
          echo "Tests complets avec analyse de couverture réaliste..."
          coverage run \
            --source='accounts,diary' \
            --omit='*/migrations/*,*/tests/*,*/__init__.py,*/apps.py,*/urls.py,*/constants.py,*/admin.py,*/settings/*,*/manage.py,*/wsgi.py,*/asgi.py,*/metrics/*' \
            --branch \
            manage.py test accounts.tests diary.tests --verbosity=2

          echo "Génération des rapports..."
          coverage report --show-missing --skip-covered --sort=cover
          coverage html --skip-covered --title="Dream Journal Coverage Report"
          coverage xml
          coverage json
          coverage-badge -f -o coverage.svg

          echo "Analyse détaillée..."
          coverage report --show-missing | grep -E "(models|views|utils|forms)\.py" || true

      - name: Coverage Quality Check
        working-directory: DreamProject
        run: |
          echo "Vérification qualité coverage..."

          # Extraire le pourcentage total
          COVERAGE=$(coverage report | tail -1 | grep -oE '[0-9]+%' | head -1 | sed 's/%//')
          echo "Coverage total: ${COVERAGE}%"

          # Définir seuils réalistes par type de fichier
          echo "Vérification par composant:"
          coverage report --show-missing | grep "models.py" | while read line; do
            echo "Models: $line"
          done

          coverage report --show-missing | grep "views.py" | while read line; do
            echo "Views: $line"
          done

          coverage report --show-missing | grep "utils.py" | while read line; do
            echo "Utils: $line"
          done

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            DreamProject/htmlcov/
            DreamProject/coverage.xml
            DreamProject/coverage.svg
          retention-days: 30
