name: Tests Hebdomadaires Complets

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      full_coverage:
        description: "Générer rapport de couverture complet"
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: "3.11"
  GROQ_API_KEY: "test-secret-key-for-ci"
  MISTRAL_API_KEY: "test-secret-key-for-ci"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/onyria_test"

jobs:
  weekly-tests:
    name: "Tests Hebdomadaires Complets"
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onyria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d onyria_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      
      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage coverage-badge bandit safety tblib
      
      - name: Wait for Postgres
        run: |
          echo "Attente de Postgres..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres est prêt !"
              break
            fi
            echo "Tentative $i/30..."
            sleep 2
          done
      
      - name: Security Audit - Bandit
        continue-on-error: true
        run: |
          echo "Audit sécurité avec Bandit..."
          bandit -r DreamProject/diary/ -f json -o bandit-report.json || true
          bandit -r DreamProject/diary/ -f txt
      
      - name: Security Audit - Safety
        continue-on-error: true
        run: |
          echo "Vérification des dépendances avec Safety..."
          safety status --json --output safety-report.json || true
          safety status
      
      - name: Run All Tests with Coverage
        working-directory: DreamProject
        run: |
          echo "Tests complets avec analyse de couverture..."
          coverage run --source='diary' --omit='*/migrations/*,*/tests/*' manage.py test diary.tests --verbosity=2
          coverage report --show-missing
          coverage html
          coverage xml
          coverage-badge -f -o coverage.svg

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            DreamProject/htmlcov/
            DreamProject/coverage.xml
            DreamProject/coverage.svg
          retention-days: 30
